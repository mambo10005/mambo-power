name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    env:
      # Overrides .python-version so the 3.11 / 3.13 legs really run on their interpreter.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: AC-7 timing figure (case300 cold / warm seconds in the log)
        # The ubuntu 3.12 leg is the contracted surface for the < 1.0 s cold-solve threshold;
        # -s lets the test's print reach the log so the measured figure is recorded, not
        # only the pass/fail verdict.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run pytest tests/parity/test_ac_timing.py -q -s -p no:cacheprovider

  pypi-sequencing:
    # AC-3 (wave M9, W5): docs/getting-started.md may not claim PyPI availability before a
    # matching v0.1.0+ tag exists. scripts/check_pypi_sequencing.py is stdlib-only (no `uv
    # sync`, no project install) so this job stays a few seconds; fetch-depth: 0 is needed
    # so the tag history it inspects is actually present.
    name: pypi sequencing guard
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_pypi_sequencing.py

  examples:
    # AC-9: every script under examples/ runs to completion against the installed package.
    # tests/unit/test_examples_run.py runs the same loop inside the test matrix; this job
    # exists so each script's output is readable in the CI log on its own.
    name: examples (run every script)
    runs-on: ubuntu-latest
    needs: []
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - name: Run every example
        run: |
          set -euo pipefail
          for f in examples/*.py; do
            echo "::group::$f"
            uv run python "$f" || { echo "::error::$f failed"; exit 1; }
            echo "::endgroup::"
          done

  install-smoke:
    # AC-8: the built wheel installs into a clean venv (no project, no dev group) and is
    # usable; the sdist is buildable and installable. Independent of the test matrix.
    name: install smoke (wheel + sdist)
    runs-on: ubuntu-latest
    needs: []
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv build
      - name: List artifacts
        run: ls -la dist/

      - name: Wheel ships py.typed and nothing from fixtures/ or tests/
        run: |
          set -euo pipefail
          listing="$(uv run --no-project --python 3.12 python -m zipfile -l dist/*.whl)"
          echo "$listing"
          grep -Eq '(^|/)py\.typed[[:space:]]' <<<"$listing" \
            || { echo "::error::py.typed missing from wheel"; exit 1; }
          if grep -E '(^|/)(fixtures|tests)/' <<<"$listing"; then
            echo "::error::wheel bundles fixtures/ or tests/"; exit 1
          fi

      - name: Sdist carries src, tests, fixtures and nothing machine-local
        run: |
          set -euo pipefail
          listing="$(tar -tzf dist/*.tar.gz)"
          echo "$listing"
          for required in src/mambo_power/py.typed tests/conftest.py fixtures/matpower/case14.m \
                          README.md LICENSE pyproject.toml; do
            grep -Eq "^[^/]+/${required}\$" <<<"$listing" \
              || { echo "::error::sdist is missing ${required}"; exit 1; }
          done
          if grep -E '^[^/]+/(\.bionic|\.github|\.venv|uv\.lock|\.python-version)' <<<"$listing"; then
            echo "::error::sdist bundles machine-local or CI files"; exit 1
          fi

      - name: Install wheel into a clean venv (no dev group) and load case14
        run: |
          set -euo pipefail
          uv venv .smoke --python 3.12
          uv pip install --python .smoke dist/*.whl
          uv pip list --python .smoke
          .smoke/bin/python -c "import mambo_power; from mambo_power.io import matpower; n = matpower.load('fixtures/matpower/case14.m'); print(mambo_power.__version__, len(n.buses))"

      - name: Install sdist into a second clean venv and import
        run: |
          set -euo pipefail
          uv venv .smoke2 --python 3.12
          uv pip install --python .smoke2 dist/*.tar.gz
          .smoke2/bin/python -c "import mambo_power; print('sdist install ok', mambo_power.__version__)"

  docs:
    # AC-8: the documentation site builds with zero warnings; the API reference is generated
    # from the docstrings under src/, so a broken cross-reference or a missing page fails here.
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    needs: []
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 14
