[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mambo-power"
version = "0.0.1.dev0"
description = "Fundamental Python package for power system analysis and electricity market modelling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "highspy",
  "pydantic>=2",
]

[dependency-groups]
dev = [
  "pytest",
  "hypothesis",
  "pandapower",
  "pypsa",
  "ruff",
  "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mambo_power"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".bionic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandapower.*", "pypsa.*", "highspy.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "unit: fast, hermetic tests of our own code (tests/unit)",
  "parity: tests comparing against the pandapower / PyPSA oracles (tests/parity)",
  "property: hypothesis property-based tests (tests/property)",
]
